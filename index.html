<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1A2B4E" />
    <title>QTecnico — Gestão de OS</title>
    <meta name="description" content="QTecnico — Gestão de Ordens de Serviço para técnicos." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QTecnico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <style>html,body{height:100%;margin:0}#root{height:100%}body{background-color:#1A2B4E}</style>
    <script>
      // Remove obsolete PWA workers/caches after the deployment that introduced
      // the admin shell. This prevents an old cached index from requesting CSS
      // assets that no longer exist, which otherwise gets the SPA fallback HTML.
      (function(){
        try {
          var key='qtecnico-pwa-migration-2026-09-15';
          if(!sessionStorage.getItem(key) && 'serviceWorker' in navigator){
            sessionStorage.setItem(key,'1');
            navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}));}).then(function(){
              if(window.caches) return caches.keys().then(function(keys){return Promise.all(keys.map(function(k){return caches.delete(k)}))});
            }).then(function(){window.location.reload()}).catch(function(){});
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
