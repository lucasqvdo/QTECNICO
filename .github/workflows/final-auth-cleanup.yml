name: Final auth cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean legacy auth
        run: node scripts/final-auth-cleanup.mjs
      - name: Verify
        run: |
          ! grep -R -n --exclude-dir=node_modules --exclude-dir=.git 'qtecnico_token' src/app
          ! grep -R -n --exclude-dir=node_modules --exclude-dir=.git 'Authorization: Bearer' src/app
      - name: Commit cleaned source and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/final-auth-cleanup.yml scripts/final-auth-cleanup.mjs
          git add src/app/App.tsx
          git commit -m 'security: final auth frontend cleanup'
          git push origin HEAD:main
