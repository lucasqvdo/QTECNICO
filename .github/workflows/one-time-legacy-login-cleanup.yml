name: One-time legacy login cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy login from source
        run: node scripts/security-build.mjs

      - name: Verify cleanup
        run: |
          ! grep -R -n --exclude-dir=node_modules --exclude-dir=.git 'regPass.length < 6' src server
          ! grep -R -n --exclude-dir=node_modules --exclude-dir=.git 'newPassword.length < 6' src server
          ! grep -R -n --exclude-dir=node_modules --exclude-dir=.git 'Mínimo 6 caracteres' src server
          ! grep -R -n --exclude-dir=node_modules --exclude-dir=.git 'function LoginScreen' src/app/App.tsx
          grep -n 'SecureLoginScreen' src/app/App.tsx

      - name: Commit cleaned source and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-legacy-login-cleanup.yml
          git add src/app/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'security: remove legacy login source'
          git push origin HEAD:main
